name: astrbot_plugin_watch_together
display_name: 一起观影
short_desc: 和 AI 一起看电影：它读字幕、看画面，边看边吐槽，还能在聊天里陪你聊剧情
desc: |
  AstrBot 装在 NAS 上，人在电脑前看电影——这个插件把两边接起来。

  插件会在 NAS 上开一间小小的 HTTP 观影室（默认 6199 端口），电脑浏览器打开就能点播
  NAS 里的影片；AI 通过同名字幕（可选再加一帧画面截图）理解剧情，按你设置的节奏说一两句
  点评，以字幕/弹幕的形式浮在画面上，同时可以推送到 QQ / Telegram 等聊天窗口。
  看电影时直接在聊天里说话，AI 会接着当前剧情回应你。

  功能：
  - 片库扫描：自动识别 SRT / ASS / VTT 字幕与 Emby/Jellyfin 的 nfo 简介
  - 三种看法：NAS 点播（mp4/webm）、打开电脑本地文件、外部播放器同步计时
  - AI 点评：字幕上下文 + 可选画面截图，控制频率、避免剧透和重复
  - 聊天桥接：观影期间的消息自动带上"一起看电影"的上下文
  - 零额外依赖：只用 Python 标准库；MKV 等格式可选 ffmpeg 实时转封装
version: 1.0.1
author: 观影小队
repo: https://github.com/your-name/astrbot_plugin_watch_together
astrbot_version: ">=4.5.7"
support_platforms:
  - aiocqhttp
  - telegram
  - qq_official
  - lark
  - discord
  - slack
  - kook
  - satori